{% extends 'base.html' %}

{% block title %}Excluir tag - Portal Escolar{% endblock %}

{% block content %}
<section class="container py-4">
    <h2>Confirmar exclusão de tag</h2>
    <p>Tem certeza de que deseja excluir a tag <strong>{{ tag.nome }}</strong>?</p>

    <form method="post" action="{% url 'noticias:tag_delete' tag.id %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar exclusão</button>
        <a href="{% url 'noticias:tag_detalhe' tag.id %}" class="btn btn-secondary">Cancelar</a>
    </form>
</section>
{% endblock %}
